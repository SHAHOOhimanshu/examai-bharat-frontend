<div class="main">

  <!-- LEFT: illustration / value prop -->
  <!-- LEFT: illustration / value prop -->
  <div class="left-section" (mouseenter)="pauseAutoplay()" (mouseleave)="startAutoplay()"
    (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">

    <div class="slide-track">

      <div class="slide" *ngFor="let slide of slides; let i = index" [class.active]="currentIndex()=== i">
        <img [src]="slide.image" [alt]="slide.alt">
        <h2>{{slide.title}}</h2>
        <p>{{slide.description}}</p>

      </div>


    </div>
    <div class="dots">
      <button type="button" *ngFor=" let slide of slides; let i=index" class='dot' [class.active]="currentIndex()===i"
        (click)="goToSlide(i)" [attr.aria-label]="'Go to slide ' + (i + 1)">
      </button>

    </div>
  </div>
  <!-- RIGHT: registration form -->
  <div class="right-section">

    <div class="logo">
      <img src="images/logo.png" alt="Logo">
      <span>Exam-AI</span>
    </div>

    <p class="form-title">Registration</p>

    <form class="register-form" [formGroup]="signupForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="UserName"><span class="req">*</span>Name</label>
        <input type="text" name="fullName" id="UserName" formControlName="fullName" placeholder="Please enter your name"
          required [class.invalid]="f['fullName'].invalid && f['fullName'].touched">

      </div>

      <div class="form-row">
        <div class="field">
          <label for="Email"><span class="req">*</span>Email</label>
          <input type="email" name="email" id="Email" formControlName="email" placeholder="Please enter your email"
            required required [class.invalid]="f['email'].invalid && f['email'].touched">


        </div>
        <div class="field">
          <label for="PhNumber"><span class="req">*</span>Phone Number</label>
          <input type="tel" name="phone" id="PhNumber" formControlName="phone"
            placeholder="Please enter your phone number" required required
            [class.invalid]="f['phone'].invalid && f['phone'].touched">


        </div>
      </div>

      <div class="form-row">
        <div class="field password-field">
          <label for="Password"><span class="req">*</span>Password</label>
          <input type="password" name="password" id="Password" formControlName="password"
            placeholder="Please enter your new password" required
            [class.invalid]="f['password'].invalid && f['password'].touched">
          <button type="button" class="toggle-eye" data-target="Password">👁</button>
        </div>
        <div class="field password-field">
          <label for="CnfPassword"><span class="req">*</span>Confirm Password</label>
          <input type="password" name="cnfPassword" id="CnfPassword" formControlName="confirmPassword"
            placeholder="Please re-enter your password" required
            [class.invalid]="f['confirmPassword'].invalid && f['confirmPassword'].touched">
          <button type="button" class="toggle-eye" data-target="CnfPassword">👁</button>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="State"><span class="req">*</span>State</label>
          <select name="state" id="State" formControlName="state" required
            [class.invalid]="f['state'].invalid && f['state'].touched">
            <option value="">Please select State</option>
            <option value=" bihar">Bihar</option>
            <option value="delhi">Delhi</option>
            <option value="up">Uttar Pradesh</option>
          </select>
        </div>
        <div class="field">
          <label for="City"><span class="req">*</span>City</label>
          <select name="city" id="City" formControlName="city" required
            [class.invalid]="f['city'].invalid && f['city'].touched">
            <option value="">Please select City</option>
            <option value=" sitamarhi">Sitamarhi</option>
            <option value="patna">Patna</option>
            <option value="mehsi">Mehsi</option>
            <option value="delhi">Delhi</option>
          </select>
        </div>
      </div>

      <button type="submit" class="register-btn">Register</button>
    </form>

    <p class="login-link">Have Account? <a routerLink="/login">Login</a></p>
    
    <p class="terms-text">By clicking Register, you agree to our <a routerLink="/terms">Terms &amp; Conditions</a> and
      <a routerLink="/privacy">Privacy Policy</a>.
    </p>

  </div>
</div>
